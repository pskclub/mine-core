name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, because a new advisory can land against a dependency that no
    # commit has touched -- the code does not have to change to become unsafe.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # govulncheck reports only vulnerabilities whose affected *symbols* are
  # reachable from this module's code. A vulnerable function in a dependency
  # that nothing here calls is listed as informational and does not fail the
  # job -- which is what keeps this gate meaningful rather than permanently red.
  govulncheck:
    name: govulncheck (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v2
            dir: v2
            go-version-file: v2/go.mod
          - name: v1
            dir: .
            go-version: "1.27"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: govulncheck
        working-directory: ${{ matrix.dir }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # One toolchain builds both: the root module's go directive (1.20) is a
      # floor, not a pin.
      - uses: actions/setup-go@v7
        with:
          go-version-file: v2/go.mod
          cache-dependency-path: |
            go.sum
            v2/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality

      # Manual, because autobuild only finds the root module: v2/ is nested and
      # would never be compiled, which means never analysed.
      - name: Build both modules
        run: |
          go build ./...
          (cd v2 && go build ./...)

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
