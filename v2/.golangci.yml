# golangci-lint v2 -- run `make lint` from the repository root. The version is
# pinned in the root Makefile and in .github/workflows/ci.yml; bump both together.
version: "2"

run:
  timeout: 10m
  # Integration tests are linted too: a file behind a build tag is otherwise a
  # file the linter never reads, and it rots exactly as fast as the rest.
  build-tags:
    - integration

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # an unclosed response body leaks the connection it rode on
    - copyloopvar
    - durationcheck
    - misspell
    - nilerr        # `if err != nil { return nil }` is almost never what was meant
    - nolintlint    # a //nolint must name its linter and say why
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        # golangci-lint's own defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # "could remove embedded field from selector": naming the embedded field
        # is frequently the clearer spelling -- db.Dialector.Name() says which
        # layer answers the call.
        - -QF1008

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # examples/ is documentation that compiles. Each file is a set of snippets
      # a reader copies from; nothing is meant to call them.
      - path: examples/
        linters: [unused, errcheck]
      - path: _test\.go
        linters: [errcheck, bodyclose]

      # -----------------------------------------------------------------------
      # Known findings carried over from the import of v2. Each is a real item
      # to resolve, not a pattern to tolerate: they are pinned to their exact
      # file and message so the same mistake anywhere else still fails. Delete
      # each rule in the commit that fixes it.
      # -----------------------------------------------------------------------

      # Firebase deprecated device tokens in favour of FIDs. Moving over changes
      # what callers pass in, so it is an API decision, not a lint fix.
      - path: fcm\.go
        text: 'SA1019: .*\.Tokens? is deprecated'
        linters: [staticcheck]
      # sentry-go replaced SendDefaultPII with DataCollection. Switching alters
      # which request data reaches Sentry, and needs a deliberate choice.
      - path: sentry\.go
        text: 'SA1019: .*SendDefaultPII is deprecated'
        linters: [staticcheck]
      # Runner drops shutdown's error on the signal path.
      - path: runner\.go
        text: 'Error return value of `r\.shutdown` is not checked'
        linters: [errcheck]
      # Declared on the consumer, never read.
      - path: mq_consumer\.go
        text: 'field requeueOnUp is unused'
        linters: [unused]
      - path: sentry\.go
        text: 'S1016:'
        linters: [staticcheck]
      - path: llm_memory\.go
        text: 'S1011:'
        linters: [staticcheck]
      - path: requester_test\.go
        text: 'SA1029:'
        linters: [staticcheck]

formatters:
  enable:
    - gofmt
